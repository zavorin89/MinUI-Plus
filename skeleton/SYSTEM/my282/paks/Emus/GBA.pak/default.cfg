-gpsp_save_method = libretro
minarch_screen_scaling = Aspect
minarch_screen_sharpness = Crisp
minarch_cpu_speed = Auto
minarch_screen_effect = Grid
minarch_screen_border = On
gpsp_frame_mixing = enabled
gpsp_color_correction = enabled

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind A Button = A
bind B Button = B
bind A Turbo = NONE:X
bind B Turbo = NONE:Y
bind L Button = L1
bind R Button = R1
