minarch_screen_scaling = Aspect

pokemini_video_scale = 3x
-pokemini_60hz_mode = enabled
pokemini_palette = Old
pokemini_piezofilter = disabled
pokemini_lowpass_filter = enabled
minarch_screen_sharpness = Crisp
minarch_cpu_speed = Auto
minarch_screen_effect = None
